function buildCropData(crop) {
  const base = CROP_BASE[crop];
  const markets = MARKET_TEMPLATE.map((m) => ({ ...m, price: Math.round(base * (1 + m.offset)) }));
  const buyers = BUYER_TEMPLATE.map((b) => {
    const offer = base + b.priceDelta;
    const netPerQ = offer - b.transport - b.storage;
    return { ...b, offer, netPerQ };
  });
  return { base, markets, buyers };
}

function formatEta(distanceKm) {
  const minutes = Math.max(20, Math.round((distanceKm / 40) * 60)); // demo assumption: ~40 km/h average
  const hrs = Math.floor(minutes / 60);
  const mins = minutes % 60;
  return hrs > 0 ? `${hrs} hr ${mins} min` : `${mins} min`;
}

function transportStatusLabel(tx, t) {
  if (tx.stage < 3) return t.transportStatusUnassigned;
  if (tx.stage === 3) return t.transportStatusAssigned;
  if (tx.stage === 4) return t.transportStatusPickup;
  if (tx.stage === 5) return t.transportStatusTransit;
  if (tx.stage === 6) return t.transportStatusNear;
  return t.transportStatusDelivered;
}

function checkQtyFit(farmerQty, qtyReqStr) {
  const nums = (qtyReqStr.match(/\d+/g) || []).map(Number);
  if (nums.length < 2) return "partial";
  const [min, max] = nums;
  return farmerQty >= min && farmerQty <= max ? "match" : "partial";
}

// Grade ranking used only to compare a farmer's declared quality
// against a buyer's minimum requirement (higher rank = better grade).
const GRADE_RANK = { gradeA: 2, gradeB: 1 };

function checkQualityMatch(farmerQuality, buyerQuality) {
  const farmerRank = GRADE_RANK[farmerQuality] || 0;
  const buyerRank = GRADE_RANK[buyerQuality] || 0;
  if (farmerRank >= buyerRank) return "full";
  if (farmerRank === buyerRank - 1) return "partial";
  return "mismatch";
}

/**
 * Dynamic, explainable match score (0-100). Never hard-coded — every
 * run recomputes each factor from the buyer + the farmer's current
 * crop/quality/quantity input, so the total changes whenever that
 * input or the buyer set changes.
 *
 * Weights: Crop fit 10, Quality fit 20, Quantity fit 15,
 * Logistics fit 10, Verified buyer 15, Reliability 15, Net realization 15.
 */
function computeMatchScore(buyer, cropForm, buyersInSet) {
  const qualityMatch = checkQualityMatch(cropForm.quality, buyer.quality);
  const qtyFit = checkQtyFit(cropForm.qty, buyer.qtyReq);
  const maxDistance = Math.max(...buyersInSet.map((b) => b.distance), 1);
  const maxNet = Math.max(...buyersInSet.map((b) => b.netPerQ), 1);

  const cropPts = 10; // this buyer set already deals in the requested crop
  const qualityPts = qualityMatch === "full" ? 20 : qualityMatch === "partial" ? 10 : 0;
  const quantityPts = qtyFit === "match" ? 15 : 7;
  const logisticsPts = Math.round((1 - buyer.distance / maxDistance) * 10);
  const verifiedPts = 15; // all listed demo buyers are marked verified
  const reliabilityPts = Math.round((buyer.reliability / 100) * 15);
  const netPts = Math.round((Math.max(buyer.netPerQ, 0) / maxNet) * 15);

  const score = Math.max(0, Math.min(100, cropPts + qualityPts + quantityPts + logisticsPts + verifiedPts + reliabilityPts + netPts));

  const factors = [
    { key: "crop", status: "good", pts: cropPts },
    { key: "quality", status: qualityMatch === "full" ? "good" : qualityMatch === "partial" ? "warn" : "bad", pts: qualityPts },
    { key: "quantity", status: qtyFit === "match" ? "good" : "warn", pts: quantityPts },
    { key: "logistics", status: logisticsPts >= 6 ? "good" : "warn", pts: logisticsPts },
    { key: "verification", status: "good", pts: verifiedPts },
    { key: "reliability", status: buyer.reliability >= 90 ? "good" : "warn", pts: reliabilityPts },
    { key: "net", status: netPts >= 12 ? "good" : "warn", pts: netPts },
  ];

  return { score, qualityMatch, factors };
}

    }

    setDisputes((prev) => prev.map((d) => (d.id === id ? { ...d, status } : d)));

                  <div className="stat-card"><div className="label">{t.verifiedListingsLbl}</div><div className="value">{listings.filter((l) => l.qualityStatus === "verified").length}</div></div>
                  <div className="stat-card"><div className="label">{t.qualityDisputesLbl}</div><div className="value">{disputes.filter((d) => d.status !== "resolved").length}</div></div>
                  <div className="stat-card"><div className="label">{t.resolvedDisputesLbl}</div><div className="value">{disputes.filter((d) => d.status === "resolved").length}</div></div>
                </div>
                <div className="card" style={{ marginTop: 12 }}>
                  <Badge tone="saffron">{t.demoVerificationLabel}</Badge>
                  <table className="admin-tbl" style={{ marginTop: 8 }}>
                    <thead><tr><th>{t.listingColLabel}</th><th>{t.qualityColLabel}</th><th>{t.statusColLabel}</th><th>{t.actionColLabel}</th></tr></thead>
                    <tbody>
                      {listings.length === 0 && (
                        <tr><td colSpan={4} className="subtle">{lang === "mr" ? "अजून कोणतीही नोंद नाही." : lang === "hi" ? "अभी कोई लिस्टिंग नहीं है।" : "No listings yet."}</td></tr>
                      )}
                      {listings.map((l) => (
                        <tr key={l.id}>
                          <td>{cropLabel(l.crop)} · {l.qty} q</td>
                          <td>{l.quality === "gradeA" ? t.gradeA : t.gradeB}</td>
                          <td><QualityStatusBadge status={l.qualityStatus} t={t} /></td>
                          <td>{l.qualityStatus !== "verified" && <button className="ghost-btn" onClick={() => verifyListing(l.id)}>{t.verifyBtn}</button>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <h2 className="section-title" style={{ marginTop: 22 }}>{t.disputeTitle}</h2>
                <div className="card">
                  <table className="admin-tbl">
                    <thead><tr><th>{t.issueType}</th><th>{t.statusColLabel}</th><th>{t.actionColLabel}</th></tr></thead>
                    <tbody>
                      {disputes.length === 0 && (
                        <tr><td colSpan={3} className="subtle">{lang === "mr" ? "अजून कोणताही वाद नाही." : lang === "hi" ? "अभी कोई विवाद नहीं है।" : "No disputes yet."}</td></tr>
                      )}
                      {disputes.map((d) => (
                        <tr key={d.id}>
                          <td>{d.issueType === "quality_mismatch" ? t.issueQualityMismatch : d.issueType === "quantity_mismatch" ? t.issueQuantityMismatch : t.issueReported}</td>
                          <td><Badge tone={d.status === "resolved" ? "green" : "saffron"}>{d.status === "open" ? t.disputeOpen : d.status === "review" ? t.disputeReview : t.disputeResolved}</Badge></td>
                          <td className="row">
                            {d.status === "open" && <button className="ghost-btn" onClick={() => setDisputeStatus(d.id, "review")}>{t.reviewBtn}</button>}
                            {d.status !== "resolved" && <button className="ghost-btn" onClick={() => setDisputeStatus(d.id, "resolved")}>{t.resolveBtn}</button>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <h2 className="section-title" style={{ marginTop: 22 }}>{t.vFarmers} / {t.vBuyers}</h2>
                <div className="card">
                  <table className="admin-tbl">
                    <thead><tr><th>{t.nameLabel}</th><th>{t.labelLoc}</th><th>Status</th></tr></thead>
                    <tbody>
                      {FARMER_RECORDS.map((f) => {
                        const displayName = { ramesh: { mr: "रमेश पाटील", hi: "रमेश पाटिल", en: "Ramesh Patil" }, sunita: { mr: "सुनिता जाधव", hi: "सुनीता जाधव", en: "Sunita Jadhav" } }[f.key][lang || "en"];
                        return (
                          <tr key={f.key}><td>{displayName}</td><td>{f.loc}</td><td><Badge tone={f.status === "verified" ? "green" : "saffron"}>{f.status === "verified" ? t.verified : t.pending}</Badge></td></tr>
                        );
                      })}
                      {BUYER_TEMPLATE.map((b) => (
                        <tr key={b.id}><td>{b.name}</td><td>{b.location}</td><td><Badge>{t.verified}</Badge></td></tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>

          <div className="footer-note">{t.footerNote}</div>
          <div className="sources-foot">{t.sources}: Maharashtra Agriculture Department · AGMARKNET / Government OGD · e-NAM · Maharashtra State Data Bank — demo values only, not live data.</div>
        </>
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<KisanSethu />);
  </script>
</body>
</html>
